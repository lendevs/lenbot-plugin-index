name: Check catalog
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: index
      - uses: actions/checkout@v4
        with:
          repository: lendevs/LenBot
          ref: master
          path: host-source
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
      - run: uv python install 3.13
      - run: uv venv --python 3.13
      - run: uv pip install ./host-source
      # Fetches each pinned commit and reads plugin.toml; plugin code is never imported.
      - run: uv run --no-project --python .venv/bin/python python host-source/scripts/check_plugin_catalog.py index/catalog.json
